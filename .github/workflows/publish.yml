name: "publish npm"

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build
        working-directory: .

      - name: Publish to npm
        run: |
          # npm requires --tag for prereleases; use the prerelease id (e.g. alpha), else latest
          TAG=$(node -p "const m = require('./package.json').version.match(/-([a-z]+)/i); m ? m[1].toLowerCase() : 'latest'")
          npm publish --access public --tag "$TAG"
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
